# conda env create -f environment.yml && conda activate tfso
# Same versions as requirements.txt (pip show in the environment that produced results/). The pinned pip section
# guarantees identical versions where conda-forge builds differ.
name: tfso
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - numpy==2.4.6
      - scipy==1.17.1
      - pandas==3.0.3
      - matplotlib==3.10.9
      - statsmodels==0.14.6
      - mpmath==1.3.0
      - cvxpy==1.9.1
      - clarabel==0.11.1
      - scs==3.2.11
      - cma==4.5.0
      - PyYAML==6.0.3
      - psutil==7.2.2
      - xlrd==2.0.2
      - openpyxl==3.1.5
      - PyMuPDF==1.27.2.3
      - pytest==9.1.1
